name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            21

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon build -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64

      - uses: actions/upload-artifact@v4
        with:
          name: GGClient
          path: build/libs/*.jar
