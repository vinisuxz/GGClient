name: Initialize Template Repo
on:
  - push

permissions:
  contents: write

jobs:
  cleanup:
    name: "Initialize Repo"
    runs-on: ubuntu-24.04
    if: github.event.repository.name != 'LegacyMinecraftModTemplate'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Initialize repository
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f make-my-own.sh ]; then
            echo "Repository is already initialized."
            exit 0
          fi

          repository_owner="${GITHUB_REPOSITORY%%/*}"
          repository_name="${GITHUB_REPOSITORY#*/}"
          owner="${repository_owner,,}"
          package_owner=$(printf '%s' "$owner" | tr -cd 'a-z0-9_')
          modid=$(printf '%s' "${repository_name,,}" | tr -cd 'a-z0-9_')
          project_name=$(printf '%s' "$repository_name" | tr -cd 'A-Za-z0-9_')
          if [[ "$package_owner" =~ ^[0-9] ]]; then package_owner="user${package_owner}"; fi
          if [[ "$modid" =~ ^[0-9] ]]; then modid="mod${modid}"; fi
          if [[ "$project_name" =~ ^[0-9] ]]; then project_name="Mod${project_name}"; fi
          package_name="com.github.${package_owner}.${modid}"

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions"
          ./make-my-own.sh "$package_name" "$project_name" "$modid" "$repository_owner"
          git add --all
          git commit -m "Initialize template repository" \
            -m "Set package name to ${package_name}, project name to ${project_name}, and mod id to ${modid}."
          git push origin "HEAD:${GITHUB_REF_NAME}"
